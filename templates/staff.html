{% extends 'base.html' %}

{% block content %}
<div class="row">
    <!-- Left Column: Live Kitchen Queue -->
    <div class="col-lg-7 mb-4">
        <div class="card border-0 rounded-4 shadow-sm">
            <div class="card-header bg-white border-0 pt-4 pb-0">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="fw-bold mb-0">
                        <span class="spinner-grow spinner-grow-sm text-danger me-2" role="status"></span>
                        Live Kitchen Queue
                    </h5>
                    <span class="badge bg-danger" id="queue-count">0 Active Orders</span>
                </div>
                <!-- Operator Info & Selector -->
                <div class="border rounded p-2 mb-2 bg-light d-flex align-items-center justify-content-between flex-wrap gap-2" style="font-size: 0.8rem;">
                    <div>
                        <i class="fa-solid fa-user-tie text-primary me-1"></i>
                        <span class="fw-semibold">Operator:</span>
                        <span id="active-operator-name" class="text-primary font-monospace">Loading...</span>
                    </div>
                    <div id="admin-operator-select-div" style="display: none;">
                        <label class="small text-muted me-1">Select staff:</label>
                        <select id="operator-select" class="form-select form-select-sm d-inline-block w-auto" style="padding: 2px 24px 2px 8px; font-size: 0.75rem;" onchange="changeActiveOperator(this.value)">
                            <!-- Loaded staff users -->
                        </select>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div id="queue-empty" class="text-center py-5">
                    <span class="fs-1">🍳</span>
                    <p class="text-muted mt-2">All caught up! No incoming kitchen orders.</p>
                </div>
                
                <div id="kitchen-queue-container" class="d-flex flex-column gap-3">
                    <!-- Dynamic orders list -->
                </div>
            </div>
        </div>
    </div>

    <!-- Right Column: Menu Inventory Settings & Summary -->
    <div class="col-lg-5">
        <!-- Daily kitchen summary -->
        <div class="card border-0 bg-primary text-white rounded-4 shadow-sm p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-semibold mb-0"><i class="fa-solid fa-mug-hot me-1"></i> Canteen Operational Summary</h6>
                <i class="fa-solid fa-clock-rotate-left text-warning fs-5"></i>
            </div>
            <div class="row text-center">
                <div class="col-6 border-end border-white-50">
                    <small class="text-white-50 d-block">Rescued plates</small>
                    <h3 class="fw-bold mb-0" id="stat-rescued-plates">0</h3>
                </div>
                <div class="col-6">
                    <small class="text-white-50 d-block">Loss Recovered</small>
                    <h3 class="fw-bold mb-0" id="stat-recovered-loss">₹0.00</h3>
                </div>
            </div>
        </div>

        <!-- Menu Inventory Grid -->
        <div class="card border-0 rounded-4 shadow-sm">
            <div class="card-header bg-white border-0 pt-4 pb-0">
                <h5 class="fw-bold"><i class="fa-solid fa-boxes-stacked text-primary me-2"></i>Inventory & Pricing</h5>
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" id="inventory-search" class="form-control" placeholder="Search inventory item..." onkeyup="filterInventory()">
                </div>
                <div class="overflow-y-auto" style="max-height: 450px;">
                    <div id="inventory-list" class="d-flex flex-column gap-3">
                        <!-- Dynamic items -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- KOT Printable Receipt Modal -->
<div class="modal fade" id="kotModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="kot-receipt-body" style="font-family: 'Courier New', Courier, monospace;">
                <!-- KOT generated content -->
            </div>
            <div class="modal-footer border-0">
                <button class="btn btn-secondary btn-sm w-100" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Token</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/staff.js') }}"></script>
{% endblock %}
